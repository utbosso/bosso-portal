<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UT Austin Codenames</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 12px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 16px;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    button {
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      background: #222841;
      color: #f5f5f5;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.primary {
      background: #2563eb;
    }

    button.danger {
      background: #b91c1c;
    }

    button:active {
      transform: scale(0.97);
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #111827;
      border: 1px solid #374151;
    }

    .toggle input {
      width: 16px;
      height: 16px;
    }

    .team-labels {
      display: flex;
      gap: 16px;
      font-size: 13px;
      justify-content: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .team-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 4px;
    }

    .dot-red   { background: #ef4444; }
    .dot-blue  { background: #3b82f6; }
    .dot-neut  { background: #6b7280; }
    .dot-ass   { background: #000000; border: 1px solid #f9fafb; }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(80px, 120px));
      gap: 8px;
      max-width: 640px;
      width: 100%;
      justify-content: center;
    }

    .card {
      position: relative;
      padding: 10px 6px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #1f2937;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      box-sizing: border-box;
    }

    .card.revealed-red {
      background: #b91c1c;
      border-color: #fecaca;
      color: #fef2f2;
    }

    .card.revealed-blue {
      background: #1d4ed8;
      border-color: #bfdbfe;
      color: #eff6ff;
    }

    .card.revealed-neutral {
      background: #4b5563;
      border-color: #d1d5db;
      color: #f9fafb;
    }

    .card.revealed-assassin {
      background: #000000;
      border-color: #f9fafb;
      color: #f9fafb;
    }

    .card .label {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 9px;
      opacity: 0.7;
    }

    .card.spymaster-red:not(.revealed-red) {
      box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.9) inset;
    }
    .card.spymaster-blue:not(.revealed-blue) {
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.9) inset;
    }
    .card.spymaster-neutral:not(.revealed-neutral) {
      box-shadow: 0 0 0 2px rgba(156, 163, 175, 0.8) inset;
    }
    .card.spymaster-assassin:not(.revealed-assassin) {
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.95) inset;
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      opacity: 0.7;
      text-align: center;
    }

    @media (max-width: 500px) {
      .board {
        grid-template-columns: repeat(5, minmax(60px, 1fr));
        gap: 6px;
      }
      .card {
        font-size: 10px;
        min-height: 52px;
        padding: 6px 4px;
      }
    }
  </style>
</head>
<body>
  <h1>UT Austin Codenames</h1>
  <div class="subtitle">Grid of UT Austin people, places, and traditions</div>

  <div class="controls">
    <button class="primary" id="new-game-btn">New Game</button>

    <div class="toggle">
      <input type="checkbox" id="spymaster-toggle" />
      <label for="spymaster-toggle">Spymaster view</label>
    </div>

    <button id="starting-team-red">Start: Red team</button>
    <button id="starting-team-blue">Start: Blue team</button>
  </div>

  <div class="team-labels">
    <span><span class="team-dot dot-red"></span>Red words: <span id="red-count">0</span></span>
    <span><span class="team-dot dot-blue"></span>Blue words: <span id="blue-count">0</span></span>
    <span><span class="team-dot dot-neut"></span>Neutral: <span id="neutral-count">0</span></span>
    <span><span class="team-dot dot-ass"></span>Assassin: <span id="assassin-count">0</span></span>
  </div>

  <div class="board" id="board"></div>

  <div class="footer">
    Click cards to reveal. Spymasters only use “Spymaster view”.
  </div>

  <script>
    // =============================================
    // 1. UT AUSTIN WORD LIST – finalized
    // =============================================
    const SPORTS_WORDS = [
      // Core UT identity
      "ut austin", "longhorns", "burnt orange", "hook em", "texas fight",
      "forty acres", "bevo", "horns", "alma mater", "big ticket",

      // Landmarks and buildings
      "tower", "pcl", "gregory gym", "greg", "jester", "san jac",
      "kinsolving", "dobie", "gdc", "welch", "mccombs", "moody",
      "utc", "union", "rsc", "dkr", "stadium", "south mall",
      "west mall", "speedway", "drag", "guadalupe",

      // Campus life
      "fig", "rush", "frat", "sorority", "intramurals", "rec sports",
      "office hours", "syllabus week", "finals", "midterms",
      "study group", "all nighter",

      // Food and hangouts
      "j2", "kinss", "jester city limits", "cava", "chipotle",
      "torchys", "pluckers", "mozart", "p terrys", "starbucks",
      "caffe medici",

      // Classes and majors
      "computer science", "management information systems",
      "neuroscience", "business", "engineering", "biology",
      "statistics", "calculus", "data science", "machine learning",

      // Traditions and culture
      "gone to texas", "moontower", "south by", "acl",
      "sixth street", "bat bridge",

      // UT phrases and misc
      "what starts here", "hook em horns", "canvas", "ut eid"
    ];

    // ==================================================
    // 2. Game state
    // ==================================================
    const boardEl = document.getElementById("board");
    const redCountEl = document.getElementById("red-count");
    const blueCountEl = document.getElementById("blue-count");
    const neutralCountEl = document.getElementById("neutral-count");
    const assassinCountEl = document.getElementById("assassin-count");
    const spymasterToggle = document.getElementById("spymaster-toggle");

    let startingTeam = "red"; // default
    let cards = [];           // array of { word, role, revealed }

    // ==================================================
    // 3. Utility functions
    // ==================================================
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickRandomWords() {
      if (SPORTS_WORDS.length < 25) {
        alert("You need at least 25 words in the UT list.");
        return [];
      }
      const shuffled = shuffle(SPORTS_WORDS);
      return shuffled.slice(0, 25);
    }

    function createRoles() {
      const roles = [];
      const firstTeamCount = 9;
      const secondTeamCount = 8;
      const neutralCount = 7;
      const assassinCount = 1;

      if (startingTeam === "red") {
        for (let i = 0; i < firstTeamCount; i++) roles.push("red");
        for (let i = 0; i < secondTeamCount; i++) roles.push("blue");
      } else {
        for (let i = 0; i < firstTeamCount; i++) roles.push("blue");
        for (let i = 0; i < secondTeamCount; i++) roles.push("red");
      }
      for (let i = 0; i < neutralCount; i++) roles.push("neutral");
      for (let i = 0; i < assassinCount; i++) roles.push("assassin");

      return shuffle(roles);
    }

    // ==================================================
    // 4. Rendering
    // ==================================================
    function updateCounts() {
      const red = cards.filter(c => c.role === "red").length;
      const blue = cards.filter(c => c.role === "blue").length;
      const neutral = cards.filter(c => c.role === "neutral").length;
      const assassin = cards.filter(c => c.role === "assassin").length;

      redCountEl.textContent = red;
      blueCountEl.textContent = blue;
      neutralCountEl.textContent = neutral;
      assassinCountEl.textContent = assassin;
    }

    function renderBoard() {
      boardEl.innerHTML = "";

      const spymasterOn = spymasterToggle.checked;

      cards.forEach((card, index) => {
        const cardEl = document.createElement("div");
        cardEl.classList.add("card");

        if (card.revealed) {
          if (card.role === "red") cardEl.classList.add("revealed-red");
          if (card.role === "blue") cardEl.classList.add("revealed-blue");
          if (card.role === "neutral") cardEl.classList.add("revealed-neutral");
          if (card.role === "assassin") cardEl.classList.add("revealed-assassin");
        }

        if (spymasterOn) {
          if (card.role === "red") cardEl.classList.add("spymaster-red");
          if (card.role === "blue") cardEl.classList.add("spymaster-blue");
          if (card.role === "neutral") cardEl.classList.add("spymaster-neutral");
          if (card.role === "assassin") cardEl.classList.add("spymaster-assassin");
        }

        cardEl.textContent = card.word;

        if (card.revealed) {
          const label = document.createElement("div");
          label.classList.add("label");
          label.textContent = card.role;
          cardEl.appendChild(label);
        }

        cardEl.addEventListener("click", () => {
          cards[index].revealed = !cards[index].revealed;
          renderBoard();
        });

        boardEl.appendChild(cardEl);
      });
    }

    // ==================================================
    // 5. Game setup
    // ==================================================
    function newGame() {
      const words = pickRandomWords();
      const roles = createRoles();
      cards = words.map((w, i) => ({
        word: w,
        role: roles[i],
        revealed: false
      }));
      updateCounts();
      renderBoard();
    }

    // ==================================================
    // 6. Event listeners
    // ==================================================
    document.getElementById("new-game-btn").addEventListener("click", newGame);

    document.getElementById("starting-team-red").addEventListener("click", () => {
      startingTeam = "red";
      newGame();
    });

    document.getElementById("starting-team-blue").addEventListener("click", () => {
      startingTeam = "blue";
      newGame();
    });

    spymasterToggle.addEventListener("change", renderBoard);

    // Initialize first game
    newGame();
  </script>
</body>
</html>
